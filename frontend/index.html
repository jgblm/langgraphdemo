<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>营销分析系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="gradient-bg text-white py-6 shadow-lg">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-bold">营销分析系统</h1>
            <p class="text-purple-100 mt-2">基于 LangGraph 的品牌营销三步分析</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <!-- Input Section -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-8 card-hover transition-all duration-300">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">创建分析任务</h2>
            <form id="taskForm" class="space-y-4">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">品牌名称</label>
                        <input type="text" id="brand" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                               placeholder="例如：星巴克">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">地区</label>
                        <input type="text" id="region" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition"
                               placeholder="例如：上海">
                    </div>
                </div>
                <button type="submit" 
                        class="w-full md:w-auto px-6 py-3 gradient-bg text-white font-semibold rounded-lg hover:opacity-90 transition shadow-md">
                    开始分析
                </button>
            </form>
        </div>

        <!-- Task List Section -->
        <div class="mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-800">任务列表</h2>
                <button onclick="loadTasks()" 
                        class="px-4 py-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition">
                    刷新
                </button>
            </div>
            <div id="taskList" class="space-y-4">
                <!-- Tasks will be loaded here -->
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultSection" class="hidden">
            <div class="bg-white rounded-xl shadow-md p-6">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-800">分析结果</h2>
                    <span id="taskStatus" class="px-3 py-1 rounded-full text-sm font-medium"></span>
                </div>
                
                <!-- Tags -->
                <div id="tagsSection" class="mb-6">
                    <h3 class="text-lg font-medium text-gray-700 mb-3 flex items-center">
                        <span class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mr-2">1</span>
                        营销标签
                    </h3>
                    <div id="tagsList" class="flex flex-wrap gap-2"></div>
                </div>

                <!-- Personas -->
                <div id="personasSection" class="mb-6">
                    <h3 class="text-lg font-medium text-gray-700 mb-3 flex items-center">
                        <span class="w-8 h-8 bg-green-100 text-green-600 rounded-full flex items-center justify-center mr-2">2</span>
                        用户画像
                    </h3>
                    <div id="personasList" class="space-y-4"></div>
                </div>

                <!-- Scenes -->
                <div id="scenesSection">
                    <h3 class="text-lg font-medium text-gray-700 mb-3 flex items-center">
                        <span class="w-8 h-8 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mr-2">3</span>
                        营销场景
                    </h3>
                    <div id="scenesList" class="space-y-4"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = window.location.origin;
        let currentTaskId = null;
        let pollInterval = null;

        // Form submit handler
        document.getElementById('taskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const brand = document.getElementById('brand').value;
            const region = document.getElementById('region').value;

            try {
                const response = await fetch(`${API_BASE}/api/v1/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ brand, region })
                });
                const data = await response.json();
                currentTaskId = data.task_id;
                document.getElementById('taskForm').reset();
                loadTasks();
                startPolling();
            } catch (error) {
                alert('创建任务失败: ' + error.message);
            }
        });

        // Load tasks
        async function loadTasks() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/tasks`);
                const data = await response.json();
                renderTasks(data.tasks || []);
            } catch (error) {
                console.error('加载任务失败:', error);
            }
        }

        // Render tasks
        function renderTasks(tasks) {
            const container = document.getElementById('taskList');
            if (!tasks || tasks.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-center py-4">暂无任务</p>';
                return;
            }

            container.innerHTML = tasks.map(task => `
                <div class="bg-white rounded-lg shadow p-4 flex justify-between items-center cursor-pointer hover:bg-gray-50 transition"
                     onclick="viewTask('${task.id}')">
                    <div>
                        <h4 class="font-medium text-gray-800">${task.brand} - ${task.region}</h4>
                        <p class="text-sm text-gray-500">${new Date(task.created_at).toLocaleString()}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-sm font-medium ${getStatusClass(task.status)}">
                        ${getStatusText(task.status)}
                    </span>
                </div>
            `).join('');
        }

        // Get status class
        function getStatusClass(status) {
            const classes = {
                'pending': 'bg-gray-100 text-gray-600',
                'processing': 'bg-blue-100 text-blue-600',
                'tags_completed': 'bg-blue-100 text-blue-600',
                'persona_completed': 'bg-green-100 text-green-600',
                'completed': 'bg-green-100 text-green-600',
                'failed': 'bg-red-100 text-red-600'
            };
            return classes[status] || 'bg-gray-100 text-gray-600';
        }

        // Get status text
        function getStatusText(status) {
            const texts = {
                'pending': '等待中',
                'processing': '处理中',
                'tags_completed': '标签完成',
                'persona_completed': '画像完成',
                'completed': '已完成',
                'failed': '失败'
            };
            return texts[status] || status;
        }

        // View task
        async function viewTask(taskId) {
            currentTaskId = taskId;
            startPolling();
        }

        // Start polling
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollTask();
            pollInterval = setInterval(pollTask, 2000);
        }

        // Poll task
        async function pollTask() {
            if (!currentTaskId) return;

            try {
                const response = await fetch(`${API_BASE}/api/v1/tasks/${currentTaskId}`);
                const task = await response.json();
                updateResult(task);

                // Stop polling if completed or failed
                if (['completed', 'failed'].includes(task.status)) {
                    clearInterval(pollInterval);
                    loadTasks();
                }
            } catch (error) {
                console.error('轮询失败:', error);
            }
        }

        // Update result
        function updateResult(task) {
            const section = document.getElementById('resultSection');
            section.classList.remove('hidden');

            // Update status
            const statusEl = document.getElementById('taskStatus');
            statusEl.textContent = getStatusText(task.status);
            statusEl.className = `px-3 py-1 rounded-full text-sm font-medium ${getStatusClass(task.status)}`;

            // Update tags
            const tagsSection = document.getElementById('tagsSection');
            if (task.tags && task.tags.length > 0) {
                tagsSection.classList.remove('hidden');
                document.getElementById('tagsList').innerHTML = task.tags.map(tag => 
                    `<span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm">${tag}</span>`
                ).join('');
            } else {
                tagsSection.classList.add('hidden');
            }

            // Update personas
            const personasSection = document.getElementById('personasSection');
            if (task.persona && task.persona.length > 0) {
                personasSection.classList.remove('hidden');
                document.getElementById('personasList').innerHTML = task.persona.map((p, i) => `
                    <div class="border border-gray-200 rounded-lg p-4">
                        <h4 class="font-medium text-gray-800 mb-2">${p.name || 'Persona ' + (i+1)}</h4>
                        <div class="grid md:grid-cols-3 gap-4 text-sm text-gray-600">
                            <div><strong>年龄:</strong> ${p.age_range || '-'}</div>
                            <div><strong>性别:</strong> ${p.gender || '-'}</div>
                            <div><strong>职业:</strong> ${p.occupation || '-'}</div>
                            <div><strong>收入:</strong> ${p.income_level || '-'}</div>
                            <div><strong>家庭:</strong> ${p.family_status || '-'}</div>
                        </div>
                        ${p.summary ? `<p class="mt-3 text-gray-600 text-sm">${p.summary}</p>` : ''}
                    </div>
                `).join('');
            } else {
                personasSection.classList.add('hidden');
            }

            // Update scenes
            const scenesSection = document.getElementById('scenesSection');
            if (task.scenes && task.scenes.length > 0) {
                scenesSection.classList.remove('hidden');
                document.getElementById('scenesList').innerHTML = task.scenes.map((s, i) => `
                    <div class="border border-orange-200 bg-orange-50 rounded-lg p-4">
                        <h4 class="font-medium text-orange-800 mb-2">${s.name || '场景 ' + (i+1)}</h4>
                        <p class="text-sm text-gray-600 mb-2">${s.scene_description || s.场景描述 || '-'}</p>
                        <div class="flex flex-wrap gap-2 text-xs">
                            ${s.target_persona || s.目标人群 ? `<span class="px-2 py-1 bg-purple-100 text-purple-700 rounded">${s.target_persona || s.目标人群}</span>` : ''}
                            ${s.timing || s.时间节点 ? `<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded">${s.timing || s.时间节点}</span>` : ''}
                            ${s.marketing_content || s.营销内容 ? `<span class="px-2 py-1 bg-green-100 text-green-700 rounded">${s.marketing_content || s.营销内容}</span>` : ''}
                        </div>
                    </div>
                `).join('');
            } else {
                scenesSection.classList.add('hidden');
            }

            // Show error if failed
            if (task.status === 'failed' && task.error_message) {
                alert('任务失败: ' + task.error_message);
            }
        }

        // Initial load
        loadTasks();
    </script>
</body>
</html>
